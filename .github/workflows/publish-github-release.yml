name: Publish release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified VSIX to the Marketplace and GitHub
        required: true
        default: false
        type: boolean
      expected_version:
        description: Exact package.json version required when publish is enabled
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'publish-github-release' || format('publish-github-release-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      sha256: ${{ steps.release.outputs.sha256 }}

    steps:
      - name: Check out workflow event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify immutable workflow action pins
        run: npm run verify:workflow-pins

      - name: Test release automation
        run: npm run test:release

      - name: Run unit tests
        run: npm run test:unit

      - name: Run VS Code integration tests
        run: xvfb-run --auto-servernum npm run test:integration

      - name: Package VSIX once
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/safe-code-release
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_DIRECTORY}"
          ./node_modules/.bin/vsce package --no-dependencies --out "${RELEASE_DIRECTORY}/unversioned.vsix"

      - name: Create and verify release manifest
        id: release
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/safe-code-release
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_VSIX: ${{ runner.temp }}/safe-code-release/unversioned.vsix
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-helper.mjs prepare

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-code-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/safe-code-release/${{ steps.release.outputs.asset_name }}
            ${{ runner.temp }}/safe-code-release/${{ steps.release.outputs.asset_name }}.sha256
            ${{ runner.temp }}/safe-code-release/release-manifest.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

  publish-marketplace:
    name: Publish exact VSIX to Marketplace
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: marketplace
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out workflow event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned publisher
        run: npm ci --ignore-scripts

      - name: Download build job release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safe-code-release-${{ github.run_id }}-1
          path: ${{ runner.temp }}/safe-code-release

      - name: Verify publication preconditions and create attempt receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKETPLACE_ATTEMPT_DIRECTORY: ${{ runner.temp }}/safe-code-marketplace-attempt
          RELEASE_DIRECTORY: ${{ runner.temp }}/safe-code-release
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-helper.mjs prepare-marketplace-attempt

      - name: Persist immutable Marketplace publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-code-marketplace-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-code-marketplace-attempt/marketplace-publication-attempt.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

      - name: Verify local artifact and publish its version to Marketplace
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/safe-code-release
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-helper.mjs publish-marketplace

  publish-github:
    name: Publish exact assets to GitHub
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs:
      - build
      - publish-marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Check out workflow event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Download build job release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safe-code-release-${{ github.run_id }}-1
          path: ${{ runner.temp }}/safe-code-release

      - name: Verify Marketplace version visibility
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/safe-code-release
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-helper.mjs verify-marketplace

      - name: Create, verify, and publish GitHub draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/safe-code-release
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-helper.mjs publish-github
